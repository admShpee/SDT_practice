name: Лабораторная работа - Geometry Tests

on: [push]
jobs:
  run-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v4
      with: 
        python-version: '3.10'

    - name: Run Tests
      run: python -m unittest discover -v
